<!DOCTYPE html>
<html>
<head>
    <title>Appointments</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-dark bg-dark p-3">
    <a href="dashboard.html" class="text-white">Dashboard</a>
    <a href="patients.html" class="text-white">Patients</a>
    <a href="doctors.html" class="text-white">Doctors</a>
    <a href="appointments.html" class="text-white">Appointments</a>
    <a href="billing.html" class="text-white">Billing</a>
</nav>

<div class="container mt-4">

    <h3>Book Appointment</h3>

    <!-- Appointment Form -->
    <select id="patientSelect" class="form-control mb-2">
        <option value="">Select Patient</option>
    </select>

    <select id="doctorSelect" class="form-control mb-2">
        <option value="">Select Doctor</option>
    </select>

    <input id="appointmentDate" type="date" class="form-control mb-2">

    <button class="btn btn-success" onclick="addAppointment()">Book Appointment</button>

    <!-- Appointment Table -->
    <table class="table table-bordered mt-4">
        <thead class="table-dark">
            <tr>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="appointmentTable"></tbody>
    </table>

</div>

<script src="js/script.js"></script>

</body>
</html>
