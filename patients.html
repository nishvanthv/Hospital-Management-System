<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-dark bg-dark p-3">
    <a href="dashboard.html" class="text-white">Dashboard</a>
    <a href="patients.html" class="text-white">Patients</a>
    <a href="doctors.html" class="text-white">Doctors</a>
    <a href="appointments.html" class="text-white">Appointments</a>
    <a href="billing.html" class="text-white">Billing</a>
</nav>

<div class="container mt-4">

    <h3>Add Patient</h3>

    <!-- Patient Form -->
    <input id="name" type="text" placeholder="Name" class="form-control mb-2">
    <input id="age" type="number" placeholder="Age" class="form-control mb-2">

    <button class="btn btn-success" onclick="addPatient()">Add Patient</button>

    <!-- Patient Table -->
    <table class="table table-bordered mt-4">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="patientTable">
        </tbody>
    </table>

</div>

<!-- JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
