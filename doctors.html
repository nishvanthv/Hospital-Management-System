<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-dark p-3">
    <a href="dashboard.html" class="text-white">Dashboard</a>
    <a href="patients.html" class="text-white">Patients</a>
    <a href="doctors.html" class="text-white">Doctors</a>
    <a href="appointments.html" class="text-white">Appointments</a>
    <a href="billing.html" class="text-white">Billing</a>
</nav>

<div class="container mt-4">

    <h3>Add Doctor</h3>

    <!-- Doctor Form -->
    <input id="docName" type="text" placeholder="Doctor Name" class="form-control mb-2">
    
    <input id="specialization" type="text" placeholder="Specialization" class="form-control mb-2">
    
    <input id="docPhone" type="text" placeholder="Phone Number" class="form-control mb-2">

    <button class="btn btn-primary mt-2" onclick="addDoctor()">Add Doctor</button>

    <!-- Doctor Table -->
    <table class="table table-bordered mt-4">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Specialization</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="doctorTable"></tbody>
    </table>

</div>

<!-- JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
